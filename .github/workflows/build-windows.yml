name: Build Windows Docker Images

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  build-windows-image:
    runs-on: windows-2022

    steps:
      # Get current date/time for tag
      - name: Get current date
        id: current_date_time
        uses: kaven-universe/github-action-current-date-time@v1
        with:
          format: "YYYYMMDDHHmmss"

      # Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # Generate Docker metadata (tags & labels)
      - name: Docker meta
        id: docker_meta
        uses: crazy-max/ghaction-docker-meta@v5
        with:
          images: |
            kavenzero/${{ github.event.repository.name }}-windows
            ghcr.io/${{ github.repository }}-windows
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=${{ steps.current_date_time.outputs.time }}
            type=raw,value=latest

      # Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3            

      # Login to DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Login to GitHub Container Registry
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push Windows Docker image
      - name: Build and push Windows image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.Windows
          platforms: windows/amd64
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          # Optional: enable layer cache if needed
          # cache-from: type=registry,ref=kavenzero/${{ github.event.repository.name }}-windows:cache
          # cache-to: type=registry,ref=kavenzero/${{ github.event.repository.name }}-windows:cache,mode=max
